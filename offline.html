<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#174b3a">
    <title>You're offline · MessMate</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/assets/messmate-mark.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; padding: 1.25rem; place-items: center; color: #20352e; background: #f6f2e9; font: 1rem/1.6 system-ui, sans-serif; }
        main { width: min(100%, 31rem); padding: clamp(1.4rem, 5vw, 2.5rem); border: 1px solid #e6ded0; border-radius: 1.25rem; background: #fffdf8; box-shadow: 0 18px 50px #1f392b18; text-align: center; }
        img { width: 4rem; height: 4rem; }
        h1 { margin: .7rem 0; color: #174b3a; font-size: clamp(1.6rem, 7vw, 2.2rem); line-height: 1.1; }
        p { color: #65766d; }
        a { display: inline-block; margin-top: .5rem; padding: .75rem 1rem; border-radius: .7rem; color: white; background: #26704e; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <img src="/assets/messmate-mark.svg" alt="">
        <h1>You're offline</h1>
        <p>The saved app shell is available, but bookings, QR check-ins, and dashboard records need a live connection. Reconnect and try again.</p>
        <a href="/">Try MessMate again</a>
    </main>
</body>
</html>
